name: Sports Reservation Crawl

on:
  schedule:
    - cron: '0 * * * *'  # 매 1시간마다
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r crawlers/requirements.txt

      - name: Run reservation crawler
        run: python crawlers/reservation_crawler.py
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          sport_username: ${{ secrets.SPORT_USERNAME }}
          sport_PASSWORD: ${{ secrets.SPORT_PASSWORD }}
